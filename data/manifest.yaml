incidents:
  - id: INC-2024-0912
    title: Checkout checkout latency and payment failures
    severity: Sev-1
    started_at: "2024-09-12T14:05:00Z"
    mitigated_at: "2024-09-12T16:40:00Z"
    primary_service: checkout-api
    related_services: [payments-ledger, auth-service]
    owner_team: checkout
    summary: Downstream payments-ledger connection pool exhaustion caused checkout timeouts.
  - id: INC-2024-0918
    title: Auth session stampede after redis failover
    severity: Sev-2
    started_at: "2024-09-18T09:20:00Z"
    mitigated_at: "2024-09-18T11:05:00Z"
    primary_service: auth-service
    related_services: [redis-sessions]
    owner_team: identity
    summary: Redis failover without warm replicas caused session lookup spikes.
  - id: INC-2024-1103
    title: Payments ledger write amplification
    severity: Sev-1
    started_at: "2024-11-03T21:10:00Z"
    mitigated_at: "2024-11-04T01:25:00Z"
    primary_service: payments-ledger
    related_services: [payments-db, fraud-engine]
    owner_team: payments
    summary: Incorrect retry loop on ledger writes overloaded payments-db.
  - id: INC-2024-1201
    title: Inventory stock mismatch during flash sale
    severity: Sev-2
    started_at: "2024-12-01T18:00:00Z"
    mitigated_at: "2024-12-01T20:30:00Z"
    primary_service: inventory-api
    related_services: [catalog-api]
    owner_team: inventory
    summary: Cache TTL misconfiguration returned stale stock counts.

# Policy facts used by scripted corpus + eval gold answers
policies:
  pto:
    engineers_days_per_year: 25
    accrual_per_month: 2.08
    carryover_max_days: 5
    blackout_months: [November, December]
  expenses:
    meal_cap_usd: 75
    hotel_cap_usd: 250
    requires_receipt_above_usd: 25
    note: Foreign exchange rates are not stored in Acme docs; use live rates for USD to INR.
  remote_work:
    max_remote_days_per_week: 3
    core_hours: "10:00-15:00 local"
  security_awareness:
    phishing_training_days: 30
    laptop_encryption_required: true

ticket_counts:
  total: 200
  # Explicit Sev-1 for Payments in Q3 2024 (Jul–Sep) — gold answer for eval
  payments_sev1_q3_2024: 4

corpus_targets:
  policies: 8
  wiki: 12
  runbooks: 12
  postmortems: 4
  architecture: 10
  security: 6
