    tier: 0
    repo: github.com/acme/checkout-api
    owner_team: checkout
    depends_on: [payments-ledger, auth-service, inventory-api, notification-svc]
  - name: payments-ledger
    tier: 0
    repo: github.com/acme/payments-ledger
    owner_team: payments
    depends_on: [auth-service, payments-db]
  - name: auth-service
    tier: 0
    repo: github.com/acme/auth-service
    owner_team: identity
    depends_on: [identity-db, redis-sessions]
  - name: inventory-api
    tier: 1
    repo: github.com/acme/inventory-api
    owner_team: inventory
    depends_on: [inventory-db]
  - name: notification-svc
    tier: 1
    repo: github.com/acme/notification-svc
    owner_team: notifications
    depends_on: [redis-notif]
  - name: order-orchestrator
    tier: 1
    repo: github.com/acme/order-orchestrator
    owner_team: checkout
    depends_on: [checkout-api, inventory-api]
  - name: fraud-engine
    tier: 1
    repo: github.com/acme/fraud-engine
    owner_team: payments
    depends_on: [payments-ledger]
  - name: billing-api
    tier: 1
    repo: github.com/acme/billing-api
    owner_team: finance
    depends_on: [payments-ledger]
  - name: catalog-api
    tier: 2
    repo: github.com/acme/catalog-api
