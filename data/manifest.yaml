    depends_on: [inventory-db]
  - name: search-api
    tier: 2
    repo: github.com/acme/search-api
    owner_team: platform
    depends_on: [elasticsearch]
  - name: edge-gateway
    tier: 0
    repo: github.com/acme/edge-gateway
    owner_team: platform
    depends_on: [checkout-api, auth-service, catalog-api]
  - name: feature-flags
    tier: 2
    repo: github.com/acme/feature-flags
