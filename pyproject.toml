[project]
name = "acme-copilot"
version = "0.1.0"
description = "Hands-on RAG pipeline lab: Acme Knowledge Copilot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acme_copilot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
